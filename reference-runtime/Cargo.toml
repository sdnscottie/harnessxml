[package]
name = "harnessxml"
version = "0.1.0"
edition = "2024"
description = "Reference parser and validator for the HarnessXML open specification"
license = "Apache-2.0"
repository = "https://gitlab.com/visml/harnessxml"
readme = "README.md"

[[bin]]
name = "harnessxml"
path = "src/main.rs"

[dependencies]
quick-xml = "0.41"

[profile.release]
opt-level = 2
