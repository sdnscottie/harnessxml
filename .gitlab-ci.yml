# HarnessXML — GitLab CI/CD
#
# Copyright 2026 VisML. SPDX-License-Identifier: Apache-2.0
#
# Mirrors .github/workflows/ci.yml. Both are kept so the project builds
# identically whether it is cloned from GitLab (source of truth) or from the
# GitHub mirror, which is where most implementers will look first.

stages:
  - verify
  - deploy

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------- verify

schema:
  stage: verify
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir --quiet lxml
  script:
    - |
      python3 - <<'PY'
      from lxml import etree
      etree.XMLSchema(etree.parse('schema/v1.0/harnessxml-1.0.xsd'))
      print('XSD compiles')
      PY
    # Every example is also a conformance fixture, so an example cannot rot
    # without CI noticing. This is the gate that keeps the documentation honest.
    - python3 conformance/validate.py -v

site:
  stage: verify
  image: python:3.12-slim
  # No pip install on purpose. site/build.py is standard library only, and a
  # build that needs dependencies is one that stops working the year a
  # transitive dependency is yanked.
  script:
    - python3 site/build.py --check      # fails on a broken internal link
    - |
      set -e
      for f in site/public/index.html \
               site/public/404.html \
               site/public/sitemap.xml \
               site/public/robots.txt \
               site/public/search-index.json \
               site/public/schema/v1.0/harnessxml-1.0.xsd \
               site/public/spec/v1.0/index.html; do
        test -s "$f" || { echo "missing or empty: $f"; exit 1; }
      done
      COUNT=$(find site/public -name '*.html' | wc -l)
      echo "$COUNT pages"
      test "$COUNT" -ge 25 || { echo "only $COUNT pages — refusing a truncated site"; exit 1; }
  artifacts:
    paths:
      - site/public
    expire_in: 1 week

runtime:
  stage: verify
  image: rust:1-slim
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key:
      files:
        - reference-runtime/Cargo.toml
    paths:
      - .cargo/
      - reference-runtime/target/
  before_script:
    - rustup component add rustfmt clippy
    - apt-get update -qq && apt-get install -y -qq python3 >/dev/null
  script:
    - cd reference-runtime
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
    - cargo build --release
    # The reference implementation must pass the same suite third parties are
    # asked to pass — otherwise "conformant" means nothing.
    - cd ..
    - python3 conformance/validate.py --cmd "reference-runtime/target/release/harnessxml validate" -v

immutability:
  stage: verify
  image: alpine:3
  # A released specification version is immutable (GOVERNANCE §4). Editing one
  # is a policy violation, not a normal change — errata are appended, never
  # inlined. v1.0 is still DRAFT and therefore editable; add released versions
  # to the guard below as they freeze.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache git >/dev/null
  script:
    - |
      set -e
      git fetch --no-tags --depth=50 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      CHANGED=$(git diff --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"...HEAD || true)
      VIOLATION=0
      for f in $CHANGED; do
        case "$f" in
          spec/v1.0/*|schema/v1.0/*) ;;                      # draft — editable
          spec/v*/*|schema/v*/*)
            echo "ERROR: $f belongs to a RELEASED version and must not be modified."
            echo "       Publish a dated erratum instead."
            VIOLATION=1 ;;
        esac
      done
      exit $VIOLATION

# GitLab's built-in secret detection, in place of the gitleaks action used on
# GitHub. Both honour .gitleaks.toml, which allowlists the DELIBERATE fake keys
# in the HX-3501 test fixtures — narrowly, by literal value, so a genuine leak
# in those same files is still caught.
include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: verify

# ---------------------------------------------------------------- deploy
#
# Publishes harnessxml.com to the GCS bucket behind the shared load balancer.
# Requires these CI/CD variables (Settings -> CI/CD -> Variables), all masked:
#   GCP_SA_KEY        service-account JSON with storage + CDN invalidation rights
#   GCP_PROJECT_ID    agrarobotics-licensing
# Until they exist this job is manual, so a push never silently fails a pipeline
# on missing credentials.

deploy_site:
  stage: deploy
  image: google/cloud-sdk:slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  needs: ["site"]
  variables:
    BUCKET: harnessxml-web
    URLMAP: rumima-urlmap
  script:
    - echo "$GCP_SA_KEY" > /tmp/sa.json
    - gcloud auth activate-service-account --key-file=/tmp/sa.json
    - gcloud config set project "$GCP_PROJECT_ID"
    - gcloud storage rsync -r --delete-unmatched-destination-objects site/public "gs://$BUCKET" --cache-control="public, max-age=300"
    - gcloud storage objects update "gs://$BUCKET/assets/**"       --cache-control="public, max-age=86400"
    # A released schema is immutable, so it may be cached for a year.
    - gcloud storage objects update "gs://$BUCKET/schema/**"       --cache-control="public, max-age=31536000, immutable"
    - gcloud storage objects update "gs://$BUCKET/examples-src/**" --cache-control="public, max-age=3600"
    - gcloud compute url-maps invalidate-cdn-cache "$URLMAP" --path="/*" --async
    - rm -f /tmp/sa.json
  after_script:
    - |
      set -e
      sleep 10
      code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
      test "$(code https://harnessxml.com/)" = "200"
      test "$(code https://harnessxml.com/spec/v1.0/)" = "200"
      # A missing page must be a real 404, not the homepage with a 200.
      test "$(code https://harnessxml.com/definitely-not-a-page/)" = "404"
      echo "live site verified"
