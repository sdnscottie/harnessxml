<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HarnessXML">
  <style>
    .bg { fill: #10508c; }
    .fg { fill: none; stroke: #ffffff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #7fb6ef; }
      .fg { stroke: #0f1216; }
      .dot { fill: #0f1216; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="13"/>
  <!-- a workflow graph: one source fanning into two, joining at a sink -->
  <path class="fg" d="M17 32 L30 19 M17 32 L30 45 M30 19 L47 32 M30 45 L47 32"/>
  <circle class="dot" cx="17" cy="32" r="5.5"/>
  <circle class="dot" cx="30" cy="19" r="4.5"/>
  <circle class="dot" cx="30" cy="45" r="4.5"/>
  <circle class="dot" cx="47" cy="32" r="5.5"/>
</svg>
